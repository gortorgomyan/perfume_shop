<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — L'ESSENCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="logo">L'ESSENCE</a>
      <nav class="nav-main" aria-label="Main">
        <a href="shop.html" class="active">Shop</a>
        <a href="index.html#about">About</a>
        <a href="index.html#journal">Journal</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="icon-btn menu-toggle" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <button type="button" class="icon-btn" data-search-open aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg></button>
        <button type="button" class="icon-btn" aria-label="Account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg></button>
        <a href="checkout.html" class="icon-btn cart-link" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M6 6L5 3H2"/></svg><span class="cart-count" style="display:none">0</span></a>
      </div>
    </div>
  </header>

  <main>
    <div class="page-hero">
      <div class="container">
        <h1>The Essence of Being</h1>
      </div>
    </div>

    <div class="container shop-layout">
      <aside class="filters" aria-label="Filters">
        <h3>Scent Family</h3>
        <div class="filter-group">
          <label><input type="checkbox" name="family" value="floral"> Floral</label>
          <label><input type="checkbox" name="family" value="woody"> Woody</label>
          <label><input type="checkbox" name="family" value="oriental"> Oriental</label>
          <label><input type="checkbox" name="family" value="fresh"> Fresh</label>
        </div>
        <h3>Collection</h3>
        <div class="filter-group">
          <label><input type="checkbox" name="collection" value="signature"> Signature</label>
          <label><input type="checkbox" name="collection" value="limited"> Limited Edition</label>
          <label><input type="checkbox" name="collection" value="atelier"> Atelier</label>
        </div>
        <h3>Price Range</h3>
        <div class="filter-group">
          <label><input type="checkbox" name="price" value="under150"> Under $150</label>
          <label><input type="checkbox" name="price" value="150-200"> $150 – $200</label>
          <label><input type="checkbox" name="price" value="over200"> Over $200</label>
        </div>
      </aside>

      <div>
        <div class="shop-grid" id="shop-grid"></div>
        <nav class="pagination" aria-label="Pagination">
          <button type="button" class="active" data-page="1">1</button>
          <button type="button" data-page="2">2</button>
          <button type="button" data-action="next">Next</button>
        </nav>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="site-footer__top"><span class="logo">L'ESSENCE</span></div>
      <div class="site-footer__grid">
        <div><h4>Customer Service</h4><ul><li><a href="#">Contact Us</a></li><li><a href="#">Shipping</a></li><li><a href="#">Returns</a></li></ul></div>
        <div><h4>About Us</h4><ul><li><a href="index.html#about">Our Story</a></li><li><a href="shop.html">Shop</a></li></ul></div>
        <div><h4>Follow Us</h4><ul><li><a href="#">Instagram</a></li><li><a href="#">Pinterest</a></li></ul></div>
      </div>
      <div class="site-footer__bottom">
        <span>&copy; 2026 L'ESSENCE. All rights reserved.</span>
        <div class="site-footer__legal"><a href="#">Privacy</a><a href="#">Terms</a></div>
      </div>
    </div>
  </footer>

  <div class="search-overlay" role="dialog" aria-label="Search">
    <div class="search-overlay__box">
      <input type="search" placeholder="Search fragrances..." aria-label="Search">
      <button type="button" class="btn btn--outline" data-search-close>Close</button>
    </div>
  </div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
