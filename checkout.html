<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — L'ESSENCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="logo">L'ESSENCE</a>
      <nav class="nav-main" aria-label="Main">
        <a href="shop.html">Shop</a>
        <a href="index.html#about">About</a>
        <a href="index.html#journal">Journal</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="icon-btn menu-toggle" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <a href="checkout.html" class="icon-btn cart-link" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M6 6L5 3H2"/></svg><span class="cart-count" style="display:none">0</span></a>
      </div>
    </div>
  </header>

  <main>
    <div class="page-hero">
      <div class="container"><h1>Checkout</h1></div>
    </div>

    <div class="container checkout-layout">
      <div>
        <section class="checkout-items">
          <h2>Your Order</h2>
          <div id="cart-items"></div>
        </section>

        <section class="checkout-form">
          <h2>Shipping Information</h2>
          <form id="checkout-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="firstName" required>
              </div>
              <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="lastName" required>
              </div>
            </div>
            <div class="form-group">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required>
              </div>
              <div class="form-group">
                <label for="postal">Postal Code</label>
                <input type="text" id="postal" name="postal" required>
              </div>
            </div>
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
          </form>
        </section>
      </div>

      <aside class="order-summary">
        <h2>Order Summary</h2>
        <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="summary-shipping">$0.00</span></div>
        <div class="summary-row summary-row--total"><span>Total</span><span id="summary-total">$0.00</span></div>
        <button type="submit" form="checkout-form" class="btn btn--primary btn--full">Place Order</button>
        <p class="payment-icons">Visa · Mastercard · Amex · Apple Pay</p>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="site-footer__bottom" style="border-top:none;padding-top:0">
        <span>&copy; 2026 L'ESSENCE. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
